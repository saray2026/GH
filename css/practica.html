<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica CSS</title>
</head>
<body>
    <div style="position: fixed; top: 20px; right: 20px; width: 300px; height: 100px; border: 3px solid darkblue; background-color: lightblue;">
        Principal derecho.
        <div style="position: absolute; bottom: 0; left: 0; width: 100px; height: 50px; border: 3px solid darkcyan; background-color: lightcyan;">
            Hijo inferior izquierda.
        </div>
    </div>
    <div style="position: fixed; top: 20px; left: 20px; width: 300px; height: 100px; border: 3px solid darkblue; background-color: lightblue;">
        Principal izquierdo.
         <div style="position: absolute; bottom: 0; left: 0; width: 100px; height: 50px; border: 3px solid darkcyan; background-color: lightcyan;">
            Hijo inferior izquierda.
        </div>
    </div>
    <div style="position: fixed; bottom: 20px; right: 20px; width: 300px; height: 100px; border: 3px solid darkblue; background-color: lightblue;">
        Principal abajo derecha.
        <div style="position: absolute; top: 0; left: 0; width: 100px; height: 50px; border: 3px solid darkcyan; background-color: lightcyan;">
            Hijo superior derecha.
        </div>
    </div>
    <div style="position: fixed; bottom: 20px; left: 20px; width: 300px; height: 100px; border: 3px solid darkblue; background-color: lightblue;">
        Principal abajo izquierda.
        <div style="position: absolute; top: 0; right: 0; width: 100px; height: 50px; border: 3px solid darkcyan; background-color: lightcyan;">
            Hijo superior derecha.
        </div>
    </div>
</body>
</html>
