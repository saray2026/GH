<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empazando con CSS</title>
    <style>
        p{
            font-size: 2em;
        }
        .parrafo-azul{
            color: blue;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }
          .parrafo-verde{
            color: #008000;
        }
        .parrafo-amarillo{
            color: rgb(255, 255, 0);
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <h1 class="parrafo-azul">Mi primer CSS</h1>
    <p class="parrafo-azul">Esto va de color azul.</p>
    <p class="parrafo-amarillo">Esto va de color amarillo</p>
    <p class="parrafo-verde">Esto va de color verde</p>


    <div style="border: 2px dotted red; padding: 50px; margin: 50px;">Primer bloque</div>
    <div style="border: 5px dashed green; padding-top: 100px; margin-top: 100px;">Segundo bloque</div>
</body>
</html>
