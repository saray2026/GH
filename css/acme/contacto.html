<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagina de contacto</title>
</head>
<style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
        }
        header{
            background-color: #142b43;
            color: white;
            text-align: center;
            padding: 25px;
        }
        li.menu{
            display: inline-block;
        }
        a{
            text-decoration: none;
            color: antiquewhite;
            font-size: 18px;
            padding: 10px;
        }
        a:hover{
            color: #f0b64c;
            text-decoration: overline;
            font-weight: bold;
        }
        main{
            text-align: center;
            padding: 80px 20px;
        }
        footer{
            background-color: #142b43;
            color: white;
            text-align: center;
            padding: 20px;
        }
        form{
            background-color: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 10px;
            text-align: left;
        }
        label{
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select, textarea{
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
        }
        button{
            background-color: #24557f;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 5px;
        }
        button:hover{
            background-color: #142b43;
        }
</style>
<body>
    <header>
        <h1 style="font-weight: bold;">MECANISMOS ACME</h1>
        <nav>
            <ul>
                <li class="menu"><a href="index.html">Inicio</a></li>
                <li class="menu"><a href="contacto.html">Contacto</a></li>
                <li class="menu"><a href="ubicacion.html">Ubicación</a></li>
                <li class="menu"><a href="equipo.html">Equipo</a></li>
            </ul>   
        </nav>
    </header>
    <main>
        <h2 style="color: #142b43;">Contacta con nosotros</h2>
        <p>¿Tienes alguna duda o consulta?
            Rellena el siguiente formulario.
        </p>
        <form method="post">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escriba aquí su nombre">
                <br>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
                <br>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">
                <br>
                <label for="asunto">Asunto:</label>
                <select id="asunto" name="asunto">
                    <option value="">Selecciona una opción</option>
                    <option value="informacion">Informacion</option>
                    <option value="presupuesto">Solicitar presupuesto</option>
                    <option value="soporte">Soporte técnico</option>
                    <option value="otro">Otro</option>
                </select>
                <br>
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje..."></textarea>
                <button type="submit">Enviar formulario</button>
        </form>
    </main>
     <footer>
        <p>Aplicación web - Mecanismo ACME</p>
    </footer>
</body>
</html>
