<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios sobre formularios</title>
</head>
<body>
    <h1>Ejercicios sobre formularios</h1>
    <p><b>Formularios HTML</b></p>
    <form action="/formularios/ejercicios_formularios.html" method="post">
        <p><b>FORMULARIO 1</b></p>
        <fieldset>
            <legend>Completar</legend>
            <label for="color-input">Elija un color:</label>
            <input type="color" id="color-input" name="color">
            <br>
            <textarea name="textarea" id="textarea" rows="5" cols="53" placeholder="Por favor, escriba aquí"></textarea>
            <br>
            <label for="lenguaje"></label>
            <select name="lenguaje" id="lenguaje">
                <option value="java">Java</option>
                <option value="python">Python</option>
                <option value="html">HTML</option>
                <option value="visual_basic">Visual Basic</option>
            </select>
            <br>
            <input type="checkbox" name="ciclo" value="cicloasir">ASIR
            <input type="checkbox" name="ciclo" value="ciclodam">DAM
            <input type="checkbox" name="ciclo" value="ciclodaw">DAW
       </fieldset>
       <fieldset>
            <legend>Rellene las opciones siguientes</legend>
            <label for="date-input">Elija una fecha:</label>
            <input type="date" id="date-input" name="date">
            <br>
            <label for="file-input">Elija un fichero:</label>
            <input type="file" id="file-input" name="file">
            <br>
            <select name="ciclo" multiple size="4">
                <option value="smir">SMIR</option>
                <option value="asir">ASIR</option>
                <option value="dam">DAM</option>
                <option value="daw">DAW</option>
            </select>
       </fieldset>
    </form>
    <form action="/formularios/ejercicios_formularios.html" method="post">
        <p><b>FORMULARIO 2</b></p>
        <fieldset>
            <legend>Rellenar</legend>
            <input type="radio" name="asignatura" value="asignaturalengua">Lengua
            <br>
            <input type="radio" name="asignatura" value="asignaturamatematicas">Matemáticas
            <br>
            <input type="radio" name="asignatura" value="asignaturahistoria">Historia
            <br>
            <input type="radio" name="asignatura" value="asignaturageografia">Geografía
            <br>
            <br>
            <input type="checkbox" name="editor" value="editornotepad">Notepad
            <input type="checkbox" name="editor" value="editoremacs">Emacs
            <input type="checkbox" name="editor" value="editorotro">Otro
            <br>
            <textarea name="textarea" id="textarea" cols="59" rows="5" placeholder="Escriba aquí, por favor"></textarea>
            <br>
            <select name="procesador" id="procesador">
                <option value="amd">AMD</option>
                <option value="intel_i5">Intel i5</option>
                <option value="intel_i7">Intel i7</option>
            </select>
        </fieldset>
    </form>
    <form action="/formularios/ejercicios_formularios.html" method="post">
        <p><b>FORMULARIO 3</b></p>
        <fieldset>
            <legend>Rellenar</legend>
            <input type="radio" name="asignatura" value="asignaturageografia">Geografía
            <input type="radio" name="asignatura" value="asignaturalengua">Lengua
            <input type="radio" name="asignatura" value="asignaturamatematicas">Matemáticas
            <input type="radio" name="asignatura" value="asignaturahistoria">Historia
            <br>
            <label for="time-input">Elija una hora:</label>
            <input type="time" id="time-input" name="time">
            <br>
            <input type="checkbox" name="idioma" value="idiomaespanol">Español
            <br>
            <input type="checkbox" name="idioma" value="idiomaingles">Inglés
            <br>
            <input type="checkbox" name="idioma" value="idiomaaleman">Alemán
            <br>
            <input type="checkbox" name="idioma" value="idiomafrances">Francés
            <br>
            <label for="nombre-textarea">Nombre</label>
            <textarea name="nombre" id="nombre-textarea"></textarea>
            <br>
            <label for="apellidos-textarea">Apellidos</label>
            <input name="apellidos" id="apellidos-textarea">
        </fieldset>
    </form>
</body>
</html>
